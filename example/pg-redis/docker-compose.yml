services:
  postgres:
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  pg2redis:
    image: alikpgwalk/pg2redis:0.4.2
    environment:
      PG2REDIS_CONFIG_PATH: /etc/pg2redis/config.yaml
      PGWALK_LIC_PG2REDIS: p7WCiwxK4mvAHZve4YavXc9ip9q03kFmTQe2Qsy8TCGcv8FdakqSFh9z74pw5bfryloykJaA7A826hF38X5Q60v3W05uH3hoAhtVXCmBn7kc1BqotzhjF6aNzOva7MlElTsCcRpwQEeUBlsczo8O0vozUFAxy5eH3zRHcN938wuDTT4DjfAOABcBJRmlWjSdERq
    volumes:
      - ./pg2redis/config.yaml:/etc/pg2redis/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: example/pg-redis/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/shop?sslmode=disable
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
